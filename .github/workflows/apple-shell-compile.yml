name: Apple shell compile

on:
  pull_request:
    branches:
      - claude/vibrant-mccarthy-481j1v

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Compile and test package on macOS
        run: swift test
      - name: Compile package for iOS Simulator
        run: xcodebuild -scheme iOS18Shell -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
