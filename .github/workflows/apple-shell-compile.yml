name: Apple shell compile

on:
  pull_request:
    branches:
      - claude/vibrant-mccarthy-481j1v

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Compile and test package on macOS
        run: swift test
      - name: Typecheck standalone example on macOS
        run: |
          BIN_PATH="$(swift build --show-bin-path)"
          swiftc -typecheck -parse-as-library \
            -target "$(uname -m)-apple-macosx15.0" \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            -I "$BIN_PATH/Modules" \
            Examples/ShellExampleApp.swift
      - name: Compile package for iOS Simulator
        run: xcodebuild -scheme iOS18Shell -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/iOS18ShellDerivedData" CODE_SIGNING_ALLOWED=NO build
      - name: Typecheck standalone example for iOS Simulator
        run: |
          swiftc -typecheck -parse-as-library \
            -target arm64-apple-ios18.0-simulator \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -I "$RUNNER_TEMP/iOS18ShellDerivedData/Build/Products/Debug-iphonesimulator" \
            Examples/ShellExampleApp.swift
      - name: Select iPhone and iPad simulators
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          python3 - "$RUNNER_TEMP/simulators.json" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          devices = json.load(open(sys.argv[1]))["devices"]
          for family, key in (("iPhone", "IPHONE_SIMULATOR"), ("iPad", "IPAD_SIMULATOR")):
              candidates = [device for runtime, entries in sorted(devices.items(), reverse=True)
                            if "iOS-" in runtime for device in entries
                            if device["name"].startswith(family) and device.get("isAvailable", True)]
              if not candidates:
                  raise SystemExit(f"No available {family} simulator")
              print(f"{key}={candidates[0]['udid']}")
          PY
      - name: Run example UI smoke test on iPhone
        run: |
          xcodebuild -quiet -project Examples/ShellExampleApp.xcodeproj -scheme ShellExampleApp \
            -destination "platform=iOS Simulator,id=$IPHONE_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/ShellExampleDerivedData" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
      - name: Run example UI smoke test on iPad
        run: |
          xcodebuild -quiet -project Examples/ShellExampleApp.xcodeproj -scheme ShellExampleApp \
            -destination "platform=iOS Simulator,id=$IPAD_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/ShellExampleDerivedData" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
